name: elder_care_app
description: "CogniCare — Elder care app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.0.0

  # Fonts
  google_fonts: ^6.0.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Persistence
  shared_preferences: ^2.3.0

  # HTTP client (Phase 7.6)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true